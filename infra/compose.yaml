services:
  postgres:
    image: postgres:18-alpine
    container_name: carsharing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carsharing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carsharing_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-carsharing_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carsharing} -d ${POSTGRES_DB:-carsharing_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: pgsty/silo:latest
    container_name: carsharing-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: pgsty/mc:latest
    container_name: carsharing-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_PRIVATE:-car-sharing-private};
      /usr/bin/mc anonymous set none myminio/${S3_BUCKET_PRIVATE:-car-sharing-private};
      echo 'Bucket ${S3_BUCKET_PRIVATE:-car-sharing-private} created and configured as PRIVATE (anonymous: none).';
      exit 0;
      "
    restart: "no"

volumes:
  postgres_data:
    name: carsharing_postgres_data
  minio_data:
    name: carsharing_minio_data
