name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-and-verify:
    name: Build, Test & Smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: carsharing_dev
          POSTGRES_PASSWORD: carsharing_secret_local
          POSTGRES_DB: carsharing_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: pgsty/silo:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001

    env:
      NODE_ENV: test
      CI: 'true'
      DATABASE_URL: 'postgresql://carsharing_dev:carsharing_secret_local@localhost:5432/carsharing_dev?schema=public'
      TEST_DATABASE_URL: 'postgresql://carsharing_dev:carsharing_secret_local@localhost:5432/carsharing_test?schema=public'
      S3_ENDPOINT: 'http://localhost:9000'
      S3_BUCKET_PRIVATE: 'car-sharing-private'
      S3_BUCKET: 'car-sharing-private'
      S3_REGION: 'us-east-1'
      S3_ACCESS_KEY: 'minioadmin'
      S3_SECRET_KEY: 'minioadmin'
      S3_ACCESS_KEY_ID: 'minioadmin'
      S3_SECRET_ACCESS_KEY: 'minioadmin'
      S3_FORCE_PATH_STYLE: 'true'
      API_PORT: 4000
      API_INTERNAL_URL: 'http://localhost:4000'
      CORS_ORIGIN: 'http://localhost:3000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prepare database and btree_gist extension
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U carsharing_dev -d postgres -c "CREATE DATABASE carsharing_test;"
          docker exec ${{ job.services.postgres.id }} psql -U carsharing_dev -d carsharing_dev -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          docker exec ${{ job.services.postgres.id }} psql -U carsharing_dev -d carsharing_test -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Prepare MinIO S3 bucket
        run: |
          node -e "
            const { S3Client, CreateBucketCommand } = require('./apps/api/node_modules/@aws-sdk/client-s3');
            const s3 = new S3Client({
              endpoint: 'http://localhost:9000',
              region: 'us-east-1',
              credentials: { accessKeyId: 'minioadmin', secretAccessKey: 'minioadmin' },
              forcePathStyle: true
            });
            s3.send(new CreateBucketCommand({ Bucket: 'car-sharing-private' }))
              .then(() => console.log('✓ MinIO bucket car-sharing-private created'))
              .catch(err => {
                if (err.name === 'BucketAlreadyOwnedByYou' || err.name === 'BucketAlreadyExists') {
                  console.log('✓ MinIO bucket already exists');
                } else {
                  console.error(err);
                  process.exit(1);
                }
              });
          "

      - name: Deploy Prisma migrations
        run: |
          pnpm exec prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" pnpm exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Check code formatting (Prettier)
        run: pnpm run format:check

      - name: Build all packages
        run: pnpm run build

      - name: Typecheck all workspaces
        run: pnpm run typecheck

      - name: Run unit, constraint & e2e test suites
        run: pnpm run test

      - name: Install Playwright browsers
        run: pnpm --filter @carsharing/web exec playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: pnpm run test:smoke
